  "aggregation": {
    "formulaVersion": "1.0.0",
    "checkScore": "For every confirmed failure in a dimension, ratio = affectedScope.ratio when numeric, otherwise 1/defaultAffectedDenominator. penalty = min(singleFindingPenaltyCap, 100 * ratio * criticalMultiplier), where criticalMultiplier applies only when criticality is 关键. dimensionScore = max(0, 100 - sum(penalty)).",
    "singleFindingPenaltyCap": 25.0,
    "criticalMultiplier": 2.0,
    "criticalCap": 59.0,
    "criticalRatioSlope": 10.0,
    "defaultAffectedDenominator": "dataFileCount + labelFileCount, lower-bounded at 1 and recorded in each scorecard.scoringInputs",
    "dimensionScore": "Use findings whose checkId maps to the dimension and is enabled. If no completed or no determined check exists, score=null. Otherwise use checkScore. pending creates range [score * completedCheckCount / relevantCheckCount, score].",
    "totalScore": "Arithmetic mean of non-null dimension scores. If confirmed critical failures exist, criticalAffectedRatio is the sum of their affected ratios using the same default fallback, capped at 1. criticalCeiling=max(0, criticalCap-criticalRatioSlope*criticalAffectedRatio), and totalScore=min(mean, criticalCeiling).",
    "ranking": "totalScore desc, critical defect count asc, datasetId asc",
    "uncomputable": "null and excluded; never imputed as 0 or 100"
  },
  "pollutionIndex": {
    "formula": "100 * sum(probability_i,c for probability_i,c >= threshold_c) / N",
    "unit": "sample-level probability density points",
    "thresholds": {
      "L0-01": 0.5,
      "L2-G": 0.5,
      "L2-P": 0.5,
      "L2-T": 0.5,
      "L2-F": 0.5,
      "L3-06": 0.5,
      "L3-07": 0.5,
      "L3-MIS": 0.5
    },
    "overlapPolicy": "A sample may contribute to more than one defect class; class contributions are not mutually exclusive.",
    "ranking": "pollutionIndex ascending; genuine ties remain tied and directory order is display-only",
    "interpretation": "Model/rule observation. Without independent truth it is not official pollution rate, precision, recall or F1. Deterministic confirmed findings use probability 1.0 for this diagnostic only.",
    "missingProbability": "Retain the sample in N and report missingProbabilitySamples; never treat missing probability as zero."
  },
  "localizationTolerance": {
    "status": "project_default_not_official_unless_overridden",
    "referenceRequirement": "A locator is a confirmed hit only against an independent reference; without one it remains candidate.",
    "bbox": {
      "hitRule": "IoU >= 0.50 OR normalized center distance <= 0.05",
      "iouThreshold": 0.5,
      "normalizedCenterDistanceThreshold": 0.05
    },
    "polygon": {
      "iouThreshold": 0.5,
      "boundaryHausdorffPixel": 3.0,
      "geometryNote": "The stdlib fallback uses polygon bounding boxes; exact polygon IoU requires the optional geometry implementation."
    },
    "timeInterval": {
      "endpointToleranceSeconds": 2.0,
      "overlapRatioThreshold": 0.5
    },
    "metadata": {
      "relativeDimensionError": 0.02
    }
  },
  "expertOutlierPolicy": {
    "method": "median_mad",
    "zThreshold": 3.5,
    "minimumExperts": 3,
    "aggregate": "trimmed_mean",
    "recordExcludedExperts": true,
    "fallback": "If fewer than minimumExperts or MAD is zero, retain all finite outputs and record the fallback.",
    "reproducible": true
  },
  "criticalDefects": [
    "FILE_CORRUPT",
    "JSON_INVALID",
    "L0-01",
    "L0-03",
    "LABEL_REFERENCE_MISSING"
  ],
  "tolerances": {
    "polygonBoundsPixel": 0,
    "meanVertexDisplacementPixel": 0.5,
    "relativeAreaError": 0.02,
    "timeOffsetSecond": 0
  },
  "scope": "Nested data/label and flat PNG/CSV plus JSON packages; image, event, segmentation, rectangle, and timeseries annotations; sibling quality versions sharing stable filenames and event identifiers",
  "limitedBoundary": "Semantic error confirmation requires a unique explicitly declared clean/P0 sibling. Geometry/count/coverage differences on nonidentical images require validated content alignment and remain pending without it. Unchanged ULF metadata contradicting the raw data are retained as attribution-unresolved diagnostics. L0-01 and L0-03 share the same published observable definition; missing-reference findings retain both candidate codes.",
