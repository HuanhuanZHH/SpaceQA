    {
      "id": "B-route",
      "trigger": "current AIA/HMI missing-label candidate",
      "fallback": "retain unknown geometry; candidates do not rewrite labels"
    }
  ],
  "concurrency": "one full evaluation per allocated GPU; CPU DataLoader workers inside each run",
