  "orchestration": "pipeline",
  "entrypoint": "python3 /opt/spaceqa/entry.py",
  "modelToolAllowlist": [],
  "decisionPoints": [
    {
      "id": "applicability",
      "trigger": "family and evidence prerequisites",
      "fallback": "undetermined when evidence missing; not_applicable only with verified scope"
